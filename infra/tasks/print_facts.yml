---
- name: Gather facts
  ansible.builtin.setup:
  when: ansible_facts is not defined or ansible_facts | length == 0

- name: Compute uptime string
  ansible.builtin.set_fact:
    _uptime_days:  "{{ (ansible_facts['uptime_seconds'] // 86400) }}"
    _uptime_hours: "{{ ((ansible_facts['uptime_seconds'] % 86400) // 3600) }}"
    _uptime_mins:  "{{ ((ansible_facts['uptime_seconds'] % 3600) // 60) }}"

- name: Compute RAM used
  ansible.builtin.set_fact:
    _ram_used:  "{{ ansible_facts['memory_mb']['real']['total'] - ansible_facts['memory_mb']['real']['free'] }}"
    _ram_total: "{{ ansible_facts['memory_mb']['real']['total'] }}"

- name: Resolve SELinux mode
  ansible.builtin.set_fact:
    _selinux_mode: >-
      {{
        ansible_facts['selinux']['mode']
        if (ansible_facts['selinux'] is defined and ansible_facts['selinux']['status'] == 'enabled')
        else 'disabled'
      }}

- name: Print system info
  vars:
    _host:   "{{ ansible_facts['hostname'] }}"
    _os:     "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
    _kernel: "{{ ansible_facts['kernel'] }} ({{ ansible_facts['architecture'] }})"
    _uptime: "{{ _uptime_days }}d {{ _uptime_hours }}h {{ _uptime_mins }}m"
    _cpu:    "{{ ansible_facts['processor'][2] | default(ansible_facts['processor'][0] | default('Unknown')) }}"
    _vcpus:  "{{ ansible_facts['processor_vcpus'] | default(ansible_facts['processor_count'] | default('?')) }}"
    _memory: "{{ _ram_used }} MiB / {{ _ram_total }} MiB"
#    _ip:     "{{ ansible_facts['default_ipv4']['address'] | default('N/A') }}"
    _pkgmgr: "{{ ansible_facts['pkg_mgr'] | default('unknown') }}"
  ansible.builtin.debug:
    msg: |

      ansible@{{ _host }}
      ----------------------------------
      OS       : {{ _os }}
      Kernel   : {{ _kernel }}
      Uptime   : {{ _uptime }}
      CPU      : {{ _cpu }} x{{ _vcpus }}
      Memory   : {{ _memory }}
      SELinux  : {{ _selinux_mode }}
      Pkg Mgr  : {{ _pkgmgr }}
      ----------------------------------