server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        font/woff2
        font/woff
        font/ttf;

    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_vary on;

    # Cache static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf|mp4|webm|ogg|mp3|wav)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Handle SPA routing 
    location / {
        try_files $uri $uri/ /index.html;
    }
}
