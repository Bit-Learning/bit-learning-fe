name: Test Build Pre Deployment

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
          - "apps/web/**"
          - "apps/admin/**"
          - "packages/**"
          - "package.json"
          - "pnpm-lock.yaml"
          - "vite.config.*"
          - "tailwind.config.*"
          - "tsconfig*.json"
          - ".github/workflows/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    build:
        strategy:
            matrix:
                node: [24]
        runs-on: ubuntu-latest
        name: Build for Node.js ${{ matrix.node }}
        steps:
            - name: Setup Node.js
              uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
              with:
                  node-version: ${{ matrix.node }}

            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  run_install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Build
              run: pnpm run build

            - name: Comment PR if build fails
              if: failure() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                    github.rest.issues.createComment({
                      issue_number: context.issue.number,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: `
                      ❌ **Frontend build failed**

                      The frontend build failed for this pull request.

                      | | |
                      |---|---|
                      | 🔀 **Branch** | \`${{ github.head_ref || github.ref_name }}\` |
                      | 📝 **Commit** | \`${{ github.sha }}\` |
                      | 🕐 **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

                      Please check the workflow logs for details and fix the issues before merging.
                      `
                    })

            - name: Comment PR if build passes
              if: success() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                    github.rest.issues.createComment({
                      issue_number: context.issue.number,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: `
                      ✅ **Frontend build passed**

                      The frontend build passed successfully for this pull request.

                      | | |
                      |---|---|
                      | 🔀 **Branch** | \`${{ github.head_ref || github.ref_name }}\` |
                      | 📝 **Commit** | \`${{ github.sha }}\` |
                      | 🕐 **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
                      `
                    })
