name: Test Build Pre Deployment

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
          - "apps/web/**"
          - "apps/admin/**"
          - "packages/**"
          - "package.json"
          - "pnpm-lock.yaml"
          - "vite.config.*"
          - "tailwind.config.*"
          - "tsconfig*.json"
          - ".github/workflows/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    build:
        strategy:
            matrix:
                node: [24]
        runs-on: ubuntu-latest
        name: Build for Node.js ${{ matrix.node }}
        steps:
            - name: Setup Node.js
              uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
              with:
                  node-version: ${{ matrix.node }}

            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  run_install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Build
              run: pnpm run build

    notify-build-status:
        name: Comment PR with build status
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - name: Comment PR if build failed
              if: ${{ needs.build.result == 'failure' }}
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `
                        ❌ **Frontend build failed**

                        The CI build for this pull request did not complete successfully.

                        ### Next steps
                        1. Open the **Actions** tab and inspect the *Test Build Pre Deployment* workflow.
                        2. Check the logs for the **Build for Node.js** job.
                        3. Fix the failing build (dependencies, type errors, lint, etc.).
                        4. Push new commits; CI will run again automatically.

                        | | |
                        |---|---|
                        | 🔀 **Branch** | \`${{ github.head_ref || github.ref_name }}\` |
                        | 🕐 **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
                        `,
                      });

            - name: Comment PR if build passed
              if: ${{ needs.build.result == 'success' }}
              uses: actions/github-script@v7
              with:
                  script: |
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: `
                        ✅ **Frontend build passed**

                        All build checks for this pull request have completed successfully.

                        This PR is now **green from CI** and can be merged once required reviews are approved.

                        | | |
                        |---|---|
                        | 🔀 **Branch** | \`${{ github.head_ref || github.ref_name }}\` |
                        | 📝 **Commit** | \`${{ github.sha }}\` |
                        | 🕐 **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
                        `,
                      });
