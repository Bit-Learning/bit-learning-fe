name: Build, Push & Deploy – PROD

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    WEB_IMAGE: lcaohoanq/bitlearning-web
    ADMIN_IMAGE: lcaohoanq/bitlearning-admin

jobs:
    # ─────────────────────────────────────────────
    # 1. Check (lint / format)
    # ─────────────────────────────────────────────
    check:
        strategy:
            matrix:
                node: [22, 23]
        runs-on: ubuntu-latest
        name: Check for Node.js ${{ matrix.node }}
        steps:
            - name: Setup Node.js
              uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
              with:
                  node-version: ${{ matrix.node }}

            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Setup pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
              with:
                  run_install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Check
              run: echo "Running lint and format checks... later "

    # ─────────────────────────────────────────────
    # 2. Build & Push Docker images
    # ─────────────────────────────────────────────
    build-web:
        name: Build & Push Web (PROD)
        needs: check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build & push web image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: apps/web/Dockerfile.prod
                  push: true
                  tags: |
                      ${{ env.WEB_IMAGE }}:prod-latest
                  cache-from: type=registry,ref=${{ env.WEB_IMAGE }}:prod-cache
                  cache-to: type=registry,ref=${{ env.WEB_IMAGE }}:prod-cache,mode=max

    build-admin:
        name: Build & Push Admin (PROD)
        needs: check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build & push admin image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: apps/admin/Dockerfile.prod
                  push: true
                  tags: |
                      ${{ env.ADMIN_IMAGE }}:prod-latest
                  cache-from: type=registry,ref=${{ env.ADMIN_IMAGE }}:prod-cache
                  cache-to: type=registry,ref=${{ env.ADMIN_IMAGE }}:prod-cache,mode=max

    # ─────────────────────────────────────────────
    # 3. Deploy via Ansible
    # ─────────────────────────────────────────────
    deploy:
        name: Ansible – Deploy FE PROD
        needs: [build-web, build-admin]
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Install Ansible & required collections
              run: |
                  pip install --upgrade ansible
                  ansible-galaxy collection install community.docker community.general --force

            - name: Write SSH private key
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.PROD_VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.PROD_VPS_PORT || 22 }} \
                    ${{ secrets.PROD_VPS_HOST }} >> ~/.ssh/known_hosts

            - name: Write Ansible vault password
              run: echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > infra/.vault_pass

            - name: Write dynamic inventory (PROD)
              run: |
                  cat > infra/inventory_prod.yml << 'EOF'
                  all:
                    hosts:
                      vps-prod:
                        ansible_host: ${{ secrets.PROD_VPS_HOST }}
                        ansible_user: ${{ secrets.PROD_VPS_USER }}
                        ansible_port: ${{ secrets.PROD_VPS_PORT || 22 }}
                        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
                        ansible_python_interpreter: auto_silent
                  EOF

            - name: Run Ansible playbook (facts only)
              working-directory: infra
              run: |
                  ansible-playbook app_deploy.yml \
                    -i inventory_prod.yml \
                    -e "env=prod target_host=vps-prod" \
                    --tags facts

            - name: Run Ansible playbook (deploy PROD)
              working-directory: infra
              run: |
                  ansible-playbook app_deploy.yml \
                    -i inventory_prod.yml \
                    -e "env=prod target_host=vps-prod" \
                    --tags deploy

            - name: Annotate deployment result
              if: always()
              run: |
                  if [ "${{ job.status }}" = "success" ]; then
                    echo "✅ FE PROD deployed – web: ${{ env.WEB_IMAGE }}:prod-latest, admin: ${{ env.ADMIN_IMAGE }}:prod-latest"
                  else
                    echo "❌ FE PROD deploy failed – check Ansible output above"
                    exit 1
                  fi
