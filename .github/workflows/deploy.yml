name: Build, Push & Deploy – PROD

on:
    push:
        branches: [main,develop]
        paths:
          - "apps/web/**"
          - "apps/admin/**"
          - "packages/**"
          - "package.json"
          - "pnpm-lock.yaml"
          - "vite.config.*"
          - "tailwind.config.*"
          - "tsconfig*.json"
          - ".github/workflows/**"
          - "infra/**"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    WEB_IMAGE: lcaohoanq/bitlearning-web
    ADMIN_IMAGE: lcaohoanq/bitlearning-admin

jobs:
    # ─────────────────────────────────────────────
    # 1. Build & Push Docker images
    # ─────────────────────────────────────────────
    build-web:
        name: Build & Push Web (PROD)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build & push web image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: apps/web/Dockerfile.prodV2
                  push: true
                  tags: |
                      ${{ env.WEB_IMAGE }}:prod-latest
                  cache-from: type=registry,ref=${{ env.WEB_IMAGE }}:prod-cache
                  cache-to: type=registry,ref=${{ env.WEB_IMAGE }}:prod-cache,mode=max

    build-admin:
        name: Build & Push Admin (PROD)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build & push admin image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: apps/admin/Dockerfile.prodV2
                  push: true
                  tags: |
                      ${{ env.ADMIN_IMAGE }}:prod-latest
                  cache-from: type=registry,ref=${{ env.ADMIN_IMAGE }}:prod-cache
                  cache-to: type=registry,ref=${{ env.ADMIN_IMAGE }}:prod-cache,mode=max

    # ─────────────────────────────────────────────
    # 2. Deploy via Ansible
    # ─────────────────────────────────────────────
    deploy:
        name: Ansible – Deploy FE PROD
        needs: [build-web, build-admin]
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"
                cache: "pip"

            - name: Cache Ansible Galaxy collections
              uses: actions/cache@v4
              with:
                path: ~/.ansible
                key: ansible-${{ runner.os }}-${{ hashFiles('infra/requirements.yml') }}
                restore-keys: |
                  ansible-${{ runner.os }}-

            - name: Install Ansible & required collections
              run: |
                  pip install ansible
                  ansible-galaxy collection install -r infra/requirements.yml

            - name: Connect to Tailscale
              uses: tailscale/github-action@v4
              with:
                authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
                tags: tag:ci
                version: latest
                ping: ${{ secrets.PROD_VPS_HOST }}

            # - name: Debug Tailscale
            #   run: |
            #     tailscale status
            #     tailscale ping --timeout=20s ${{ secrets.PROD_VPS_HOST }}

            - name: Write SSH private key
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "${{ secrets.PROD_VPS_SSH_KEY }}" > ~/.ssh/bitlearningsshkey
                  chmod 600 ~/.ssh/bitlearningsshkey

                  ssh-keyscan -p ${{ secrets.PROD_VPS_PORT || 22 }} \
                    ${{ secrets.PROD_VPS_HOST }} >> ~/.ssh/known_hosts

                  ssh-keygen -R ${{ secrets.PROD_VPS_HOST }} || true
                  ssh-keyscan -H -p ${{ secrets.PROD_VPS_PORT || 22 }} \
                    ${{ secrets.PROD_VPS_HOST }} >> ~/.ssh/known_hosts
            - name: Write Ansible vault password
              run: echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > infra/.vault_pass

            - name: Write dynamic inventory (PROD)
              run: |
                  cat > infra/inventory_prod.yml << 'EOF'
                  all:
                    hosts:
                      vps-prod:
                        ansible_host: ${{ secrets.PROD_VPS_HOST }}
                        ansible_user: ${{ secrets.PROD_VPS_USER }}
                        ansible_port: ${{ secrets.PROD_VPS_PORT || 22 }}
                        ansible_ssh_private_key_file: ~/.ssh/bitlearningsshkey
                        ansible_python_interpreter: auto_silent
                  EOF

            - name: Run Ansible playbook (facts only)
              working-directory: infra
              run: |
                  ansible-playbook app_deploy.yml \
                    -i inventory_prod.yml \
                    -e "env=prod target_host=vps-prod" \
                    --tags facts

            - name: Run Ansible playbook (deploy PROD)
              working-directory: infra
              run: |
                  ansible-playbook app_deploy.yml \
                    -i inventory_prod.yml \
                    -e "env=prod target_host=vps-prod" \
                    --tags deploy

            - name: Comment PR if deploy fails
              if: failure() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                    github.rest.issues.createComment({
                      issue_number: context.issue.number,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: `
                      ❌ **PROD deployment failed**

                      The deployment to production failed for this pull request.

                      | | |
                      |---|---|
                      | 🔀 **Branch** | \`${{ github.head_ref || github.ref_name }}\` |
                      | 📝 **Commit** | \`${{ github.sha }}\` |
                      | 🕐 **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

                      Please check the Ansible output above for details.
                      `
                    })

            - name: Comment PR if deploy passes
              if: success() && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                    github.rest.issues.createComment({
                      issue_number: context.issue.number,
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      body: `
                      ✅ **PROD deployment passed**

                      Successfully deployed to production.

                      | | |
                      |---|---|
                      | 🔀 **Branch** | \`${{ github.head_ref || github.ref_name }}\` |
                      | 📝 **Commit** | \`${{ github.sha }}\` |
                      | 🕐 **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
                      `
                    })
