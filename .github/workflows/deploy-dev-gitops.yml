name: Deploy Dev via GitOps

on:
    workflow_dispatch:
    push:
        branches: [develop]
        paths:
            - "apps/web/**"
            - "apps/admin/**"
            - "packages/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - "turbo.json"
            - ".github/workflows/deploy-dev-gitops.yml"

concurrency:
    group: deploy-dev-gitops
    cancel-in-progress: true

permissions:
    contents: read
    packages: read

env:
    REGISTRY_NAMESPACE: hoangclw
    WEB_IMAGE: hoangclw/bitlearning-web
    ADMIN_IMAGE: hoangclw/bitlearning-admin
    GITOPS_REPOSITORY: lcaohoanq/bit-learning-gitops
    GITOPS_OVERLAY: k8s/overlays/dev
    IMAGE_TAG: ${{ github.sha }}

jobs:
    build-push-and-update-gitops:
        name: Build, push, update GitOps
        runs-on: ubuntu-latest
        steps:
            - name: Checkout frontend
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

            - name: Login to Docker Hub
              uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push web image
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  file: apps/web/Dockerfile.prodV2
                  push: true
                  tags: |
                      ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
                      ${{ env.WEB_IMAGE }}:dev-latest
                  build-args: |
                      VITE_API_BASE_URL=${{ secrets.DEV_VITE_API_BASE_URL }}
                      VITE_API_TIMEOUT=${{ vars.DEV_VITE_API_TIMEOUT || '30000' }}
                      VITE_SITE_URL=${{ vars.DEV_VITE_SITE_URL }}
                      VITE_WS_URL=${{ secrets.DEV_VITE_WS_URL }}

            - name: Build and push admin image
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  context: .
                  file: apps/admin/Dockerfile.prodV2
                  push: true
                  tags: |
                      ${{ env.ADMIN_IMAGE }}:${{ env.IMAGE_TAG }}
                      ${{ env.ADMIN_IMAGE }}:dev-latest
                  build-args: |
                      VITE_API_BASE_URL=${{ secrets.DEV_VITE_API_BASE_URL }}
                      VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.DEV_VITE_CLERK_PUBLISHABLE_KEY }}
                      VITE_MINIO_GAME_URL=${{ vars.DEV_VITE_MINIO_GAME_URL }}
                      VITE_MINIO_THUMBNAIL_URL=${{ vars.DEV_VITE_MINIO_THUMBNAIL_URL }}
                      VITE_PUBLIC_SITE_URL=${{ vars.DEV_VITE_PUBLIC_SITE_URL }}
                      VITE_WS_URL=${{ secrets.DEV_VITE_WS_URL }}

            - name: Checkout GitOps repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  repository: ${{ env.GITOPS_REPOSITORY }}
                  path: gitops
                  ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

            - name: Update dev image tags
              working-directory: gitops
              run: |
                  set -euo pipefail
                  file="${GITOPS_OVERLAY}/kustomization.yaml"
                  python - <<'PY'
                  from pathlib import Path
                  import os

                  path = Path(os.environ["GITOPS_OVERLAY"]) / "kustomization.yaml"
                  tag = os.environ["IMAGE_TAG"]
                  text = path.read_text()
                  lines = text.splitlines()
                  current_image = None

                  for i, line in enumerate(lines):
                      stripped = line.strip()
                      if stripped.startswith("- name: "):
                          current_image = stripped.removeprefix("- name: ").strip()
                      elif stripped.startswith("newTag: ") and current_image in {
                          "hoangclw/bitlearning-web",
                          "hoangclw/bitlearning-admin",
                      }:
                          indent = line[: len(line) - len(line.lstrip())]
                          lines[i] = f"{indent}newTag: {tag}"

                  path.write_text("\n".join(lines) + "\n")
                  PY
                  git diff -- "${file}"

            - name: Commit and push GitOps update
              working-directory: gitops
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add "${GITOPS_OVERLAY}/kustomization.yaml"
                  if git diff --cached --quiet; then
                    echo "GitOps image tags are already up to date."
                    exit 0
                  fi
                  git commit -m "chore(fe-dev): deploy ${IMAGE_TAG}"
                  git push
